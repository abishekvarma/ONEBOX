name: ONEBOX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: onebox
      MYSQL_USER: onebox
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      JWT_KEY: ci-jwt-key-must-be-at-least-32-characters-long
      ONEBOX_AGENT_SECRET: ci-agent-secret
      ONEBOX_EXECUTION_MODE: sandbox
      EXPOSE_OTP_IN_DEVELOPMENT: "false"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.6-luna
      TMDB_API_KEY: ""
      GOOGLE_API_KEY: ""
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_API_URL: http://localhost:5080
      PUBLIC_AGENT_URL: http://127.0.0.1:8787
      PAYMENTS_PHONEPE_CHECKOUT_URL: ""
      PAYMENTS_RAZORPAY_CHECKOUT_URL: ""
      PAYMENTS_PHONEPE_WEBHOOK_SECRET: ""
      PAYMENTS_RAZORPAY_WEBHOOK_SECRET: ""
      ADMIN_EMAILS: ""
      ONEBOX_ALLOWED_HOSTS: in.bookmyshow.com,bookmyshow.com,www.irctc.co.in,irctc.co.in,contents.irctc.co.in,www.google.com,google.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config -q
      - name: Build API
        run: docker compose build api
      - name: Build web
        run: docker compose build web
      - name: Build browser agent
        run: docker compose build agent
      - name: Start integration stack
        env:
          EXPOSE_OTP_IN_DEVELOPMENT: "true"
        run: docker compose up -d mysql api web agent
      - name: Wait for API
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs api mysql
          exit 1
      - name: Test registration and OTP verification
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="ci-$GITHUB_RUN_ID@example.com"
          REGISTER=$(curl -fsS -X POST http://localhost:5080/api/auth/register             -H 'Content-Type: application/json'             -d "{\"name\":\"CI Test\",\"email\":\"$EMAIL\",\"password\":\"TestPassword123!\",\"phone\":\"9999999999\"}")
          OTP=$(printf '%s' "$REGISTER" | python -c 'import json,sys; print(json.load(sys.stdin)["developmentOtp"])')
          VERIFY=$(curl -fsS -X POST http://localhost:5080/api/auth/verify-otp             -H 'Content-Type: application/json'             -d "{\"email\":\"$EMAIL\",\"otp\":\"$OTP\"}")
          TOKEN=$(printf '%s' "$VERIFY" | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "ONEBOX_CI_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -fsS http://localhost:5080/api/me -H "Authorization: Bearer $TOKEN" >/dev/null
      - name: Test platform fee quote
        shell: bash
        run: |
          set -euo pipefail
          Q=$(curl -fsS -X POST http://localhost:5080/api/payments/quote -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"providerAmount":350}')
          echo "$Q" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["providerAmount"]==350; assert d["platformFee"]==35; assert d["total"]==385'
      - name: Test task planning and sandbox execution
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"book me a movie ticket"}')
          echo "$R" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="AWAITING_INPUT"'
          R2=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"book me a movie ticket for Avatar"}')
          TASK=$(printf '%s' "$R2" | python -c 'import json,sys; print(json.load(sys.stdin)["taskId"])')
          R3=$(curl -fsS -X POST "http://localhost:5080/api/tasks/$TASK/confirm" -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$R3" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="COMPLETED"'
      - name: Test scheduled and conditional tasks
        shell: bash
        run: |
          set -euo pipefail
          RUN_AT=$(python -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)-timedelta(seconds=5)).isoformat().replace("+00:00","Z"))')
          S=$(curl -fsS -X POST http://localhost:5080/api/scheduled-tasks -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d "{\"title\":\"CI scheduled movie booking\",\"type\":\"MOVIE_BOOKING\",\"triggerType\":\"TIME\",\"runAtUtc\":\"$RUN_AT\",\"payloadJson\":\"{\\\"movie\\\":\\\"Avatar\\\"}\"}")
          SID=$(printf '%s' "$S" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for i in {1..20}; do
            L=$(curl -fsS http://localhost:5080/api/scheduled-tasks -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
            if printf '%s' "$L" | python -c 'import json,sys; d=json.load(sys.stdin); s=[x for x in d if x["id"]=="'$SID'"][0]; assert s["status"]=="CONDITION_MET"' 2>/dev/null; then break; fi
            sleep 2
          done
          printf '%s' "$L" | python -c 'import json,sys; d=json.load(sys.stdin); s=[x for x in d if x["id"]=="'$SID'"][0]; assert s["status"]=="CONDITION_MET"'
          P=$(curl -fsS -X POST http://localhost:5080/api/scheduled-tasks -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI price condition","type":"SHOPPING","triggerType":"PRICE","conditionJson":"{\"threshold\":55000,\"observedPrice\":60000}"}')
          PID=$(printf '%s' "$P" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST "http://localhost:5080/api/scheduled-tasks/$PID/observation" -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"threshold":55000,"observedPrice":54999}' >/dev/null
          sleep 7
          L=$(curl -fsS http://localhost:5080/api/scheduled-tasks -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          printf '%s' "$L" | python -c 'import json,sys; d=json.load(sys.stdin); p=[x for x in d if x["id"]=="'$PID'"][0]; assert p["status"]=="CONDITION_MET"'
      - name: Test browser agent
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:8787/health | grep -q "onebox-local-agent"; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8787/health | grep -q "onebox-local-agent"
          docker compose exec -T agent node -e "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto('http://web',{waitUntil:'domcontentloaded'});if(!(await p.locator('body').innerText()).includes('ONEBOX'))process.exit(1);await b.close()})()"
      - name: Test web
        run: curl -fsS http://localhost:5173/ | grep -q "ONEBOX"
      - name: Stop integration stack
        if: always()
        run: docker compose down -v
