name: ONEBOX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: onebox
      MYSQL_USER: onebox
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      JWT_KEY: ci-jwt-key-must-be-at-least-32-characters-long
      ONEBOX_AGENT_SECRET: ci-agent-secret
      ONEBOX_EXECUTION_MODE: sandbox
      COMMERCE_MODE: ci
      EXPOSE_OTP_IN_DEVELOPMENT: "false"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.6-luna
      TMDB_API_KEY: ""
      GOOGLE_API_KEY: ""
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_API_URL: http://localhost:5080
      PUBLIC_AGENT_URL: http://127.0.0.1:8787
      PAYMENTS_PHONEPE_CHECKOUT_URL: ""
      PAYMENTS_RAZORPAY_CHECKOUT_URL: ""
      PAYMENTS_PHONEPE_WEBHOOK_SECRET: ""
      PAYMENTS_RAZORPAY_WEBHOOK_SECRET: ""
      ADMIN_EMAILS: ""
      ONEBOX_ALLOWED_HOSTS: in.bookmyshow.com,bookmyshow.com,www.irctc.co.in,irctc.co.in,contents.irctc.co.in,www.google.com,google.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config -q
      - name: Build API
        run: docker compose build api
      - name: Build web
        run: docker compose build web
      - name: Build browser agent
        run: docker compose build agent
      - name: Start integration stack
        env:
          EXPOSE_OTP_IN_DEVELOPMENT: "true"
        run: docker compose up -d mysql api web agent
      - name: Wait for API
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs api mysql
          exit 1
      - name: Test registration and OTP verification
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="ci-$GITHUB_RUN_ID@example.com"
          REGISTER=$(curl -fsS -X POST http://localhost:5080/api/auth/register             -H 'Content-Type: application/json'             -d "{\"name\":\"CI Test\",\"email\":\"$EMAIL\",\"password\":\"TestPassword123!\",\"phone\":\"9999999999\"}")
          OTP=$(printf '%s' "$REGISTER" | python -c 'import json,sys; print(json.load(sys.stdin)["developmentOtp"])')
          VERIFY=$(curl -fsS -X POST http://localhost:5080/api/auth/verify-otp             -H 'Content-Type: application/json'             -d "{\"email\":\"$EMAIL\",\"otp\":\"$OTP\"}")
          TOKEN=$(printf '%s' "$VERIFY" | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "ONEBOX_CI_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -fsS http://localhost:5080/api/me -H "Authorization: Bearer $TOKEN" >/dev/null
      - name: Test platform fee quote
        shell: bash
        run: |
          set -euo pipefail
          Q=$(curl -fsS -X POST http://localhost:5080/api/payments/quote -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"providerAmount":350}')
          echo "$Q" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["providerAmount"]==350; assert d["platformFee"]==35; assert d["total"]==385'
      - name: Test payment checkout safety gate
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -sS -o /tmp/payment.json -w '%{http_code}' -X POST http://localhost:5080/api/payments/checkout -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"taskId":"00000000-0000-0000-0000-000000000001","provider":"ONEBOX","providerAmount":350}')
          test "$R" = "404"
          echo "Payment endpoint rejects unknown task before creating a transaction."
      - name: Test provider comparison and selection
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X PUT http://localhost:5080/api/me/location -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"latitude":12.9716,"longitude":77.5946,"allowed":true}' >/dev/null
          C=$(curl -fsS "http://localhost:5080/api/providers/compare?category=RESTAURANT_BOOKING" -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$C" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["category"]=="RESTAURANT_BOOKING"; assert isinstance(d["items"],list)'
          T=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"book a restaurant table"}')
          TASK=$(printf '%s' "$T" | python -c 'import json,sys; print(json.load(sys.stdin)["taskId"])')
          PAYLOAD=$(printf '{"taskId":"%s","providerId":"ci-provider","providerName":"CI Restaurant","category":"RESTAURANT_BOOKING","distanceKm":2.1,"rating":4.5,"ratingCount":120,"priceLevel":"PRICE_LEVEL_MODERATE"}' "$TASK")
          S=$(curl -fsS -X POST http://localhost:5080/api/providers/select -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' --data-raw "$PAYLOAD")
          echo "$S" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["providerId"]=="ci-provider"; assert d["status"] in ("READY","AWAITING_CONFIRMATION","COMPLETED")'
      - name: Test multilingual language layer
        shell: bash
        run: |
          set -euo pipefail
          L=$(curl -fsS http://localhost:5080/api/languages -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$L" | python -c 'import json,sys; codes={x["code"] for x in json.load(sys.stdin)["languages"]}; assert {"en","kn","te","ta","ml","hi","mr","ur","pa","fr","pt"} <= codes'
          D=$(curl -fsS --get --data-urlencode 'text=ನನಗೆ ಹತ್ತಿರದ ಆಸ್ಪತ್ರೆ ಬೇಕು' http://localhost:5080/api/languages/detect -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$D" | python -c 'import json,sys; assert json.load(sys.stdin)["language"]["code"]=="kn"'
          D=$(curl -fsS --get --data-urlencode 'text=मुझे अस्पताल चाहिए' http://localhost:5080/api/languages/detect -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$D" | python -c 'import json,sys; assert json.load(sys.stdin)["language"]["code"]=="hi"'
      - name: Test profile storage and controlled autofill
        shell: bash
        run: |
          set -euo pipefail
          U=$(curl -fsS http://localhost:5080/api/profile -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$U" | python -c 'import json,sys; assert json.load(sys.stdin)["preferredLanguage"]=="en"'
          curl -fsS -X PUT http://localhost:5080/api/profile -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"addressLine1":"10 Test Street","city":"Bengaluru","state":"Karnataka","postalCode":"560001","country":"India","preferredLanguage":"kn","emergencyContactName":"Test Contact","emergencyContactPhone":"9000000000"}' >/dev/null
          A=$(curl -fsS -X POST http://localhost:5080/api/profile/autofill -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"fields":["addressLine1","city","postalCode","secret"]}')
          echo "$A" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["usedProfile"] is True; assert d["fields"]["city"]=="Bengaluru"; assert "secret" not in d["fields"]'
          echo "Profile save and allowlisted autofill passed."
      - name: Test shopping comparison
        shell: bash
        run: |
          set -euo pipefail
          C=$(curl -fsS --get --data-urlencode 'query=iPhone 17' http://localhost:5080/api/commerce/compare -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$C" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["products"]; offers=[o for p in d["products"] for o in p["offers"]]; assert {"Amazon India","Flipkart"} <= {o["providerName"] for o in offers}; assert all(o["price"]>0 for o in offers)'
          echo "Shopping comparison passed."
      - name: Test task planning and sandbox execution
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"book me a movie ticket"}')
          echo "$R" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="AWAITING_INPUT"'
          R2=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"book me a movie ticket for Avatar"}')
          TASK=$(printf '%s' "$R2" | python -c 'import json,sys; print(json.load(sys.stdin)["taskId"])')
          R3=$(curl -fsS -X POST "http://localhost:5080/api/tasks/$TASK/confirm" -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          echo "$R3" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="COMPLETED"'
      - name: Test scheduled intent creation
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"Book me a movie ticket for Avatar when tickets open"}')
          printf "SCHEDULE_RESPONSE=%s\n" "$R"
          echo "$R" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="WAITING",d; r=d.get("result") or {}; assert r.get("triggerType")=="SLOT",d; assert r.get("scheduledTaskId"),d'
          SID=$(printf '%s' "$R" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["scheduledTaskId"])')
          echo "SCHEDULED_TASK_ID=$SID" >> "$GITHUB_ENV"

      - name: Test scheduled condition and confirmation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "http://localhost:5080/api/scheduled-tasks/$SCHEDULED_TASK_ID/observation" -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"available":true}' >/dev/null
          L=$(curl -fsS http://localhost:5080/api/scheduled-tasks -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          printf "SCHEDULED_TASKS=%s\n" "$L"
          echo "$L" | python -c 'import json,sys; d=json.load(sys.stdin); s=next(x for x in d if x["id"]==sys.argv[1]); assert s["status"]=="CONDITION_MET",s; assert s["notificationStatus"]=="PENDING_CONFIRMATION",s' "$SCHEDULED_TASK_ID"
          C=$(curl -fsS -X POST "http://localhost:5080/api/scheduled-tasks/$SCHEDULED_TASK_ID/confirm" -H "Authorization: Bearer $ONEBOX_CI_TOKEN")
          printf "CONFIRM_RESPONSE=%s\n" "$C"
          echo "$C" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="COMPLETED", d'

      - name: Test price conditional intent
        shell: bash
        run: |
          set -euo pipefail
          P=$(curl -fsS -X POST http://localhost:5080/api/tasks/agent -H "Authorization: Bearer $ONEBOX_CI_TOKEN" -H 'Content-Type: application/json' -d '{"message":"Buy this phone if it goes below ₹55000"}')
          printf "PRICE_RESPONSE=%s\n" "$P"
          echo "$P" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="WAITING", d; assert d["result"]["triggerType"]=="PRICE", d'
      - name: Test browser agent
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS --max-time 5 http://localhost:8787/health | grep -q "onebox-local-agent"; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200 agent
          exit 1
          docker compose exec -T agent node -e "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto('http://web',{waitUntil:'domcontentloaded'});if(!(await p.locator('body').innerText()).includes('ONEBOX'))process.exit(1);await b.close()})()"
      - name: Test web
        run: curl -fsS http://localhost:5173/ | grep -q "ONEBOX"
      - name: Stop integration stack
        if: always()
        run: docker compose down -v
